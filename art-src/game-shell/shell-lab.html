<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Eeri Shell Lab</title><style>body{margin:0;background:#4aa8e8;font:800 15px system-ui;color:#241d16}.wrap{max-width:760px;margin:4vh auto;padding:18px}.logo{text-align:center;font-size:70px;color:#ffb01f;text-shadow:0 5px #241d16}.primary{display:block;margin:10px auto 24px;min-width:240px;min-height:54px;border:4px solid #241d16;background:#ffb01f;border-radius:14px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{background:#f5e8ca;border:3px solid #241d16;border-radius:12px;padding:12px;min-height:76px}.lock{opacity:.38}.addr{font-size:13px;letter-spacing:.14em}.meta{font-size:12px;margin-top:8px;color:#6b543c}@media(max-width:520px){.logo{font-size:52px}.grid{gap:6px}.level{padding:9px}}</style><div class=wrap><div class=logo>eeri</div><button class=primary>CONTINUE · EERI 2-1</button><h2>LEVEL SELECT</h2><div class=grid id=g></div></div><script>const g=document.querySelector('#g');for(let i=0;i<12;i++){const w=Math.floor(i/3)+1,l=i%3+1,d=document.createElement('div');d.className='level'+(i>5?' lock':'');d.innerHTML=`<div class=addr>EERI ${w}-${l}</div><div>${i<6?'WORKSITE LEVEL':'LOCKED'}</div><div class=meta>${i<6?`🔩 ${Math.min(100,54+i*7)}/100 · ${i%3===0?'●○○':'●●○'}`:'—'}</div>`;g.append(d)}</script>
