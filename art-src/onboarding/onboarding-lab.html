<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eeri Onboarding Lab</title><style>body{font-family:system-ui;margin:0;background:#e9dfc8;color:#241d16}.wrap{max-width:760px;margin:auto;padding:24px}.beat{background:#fff8e8;border:3px solid #31261c;border-radius:14px;margin:12px 0;padding:16px}.safe{font-size:13px;opacity:.65}.sig{font-weight:800;color:#9b6414}button{min-height:44px;border:3px solid #31261c;border-radius:10px;background:#ffb01f;font-weight:800;padding:8px 14px}</style><div class="wrap"><h1>First five minutes</h1><p>Teaching order preview. Text shown here is design annotation, not intended tutorial copy.</p><div id="out"></div></div><script type="module">import{LESSONS}from'./onboarding-spec.js';const out=document.querySelector('#out');for(const x of LESSONS){if(x.level!=='1-1')continue;const d=document.createElement('div');d.className='beat';d.innerHTML=`<b>${x.order}. ${x.id}</b><div class=sig>${x.signal.replaceAll('_',' ')}</div><div class=safe>${x.safeSeconds}s safe observation · hint after ${x.hintAfterAttempts||'no forced'} failed attempts</div>`;out.append(d)}</script>
