<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Eeri Robot Personality Lab</title><style>body{margin:0;background:#e9dfc8;font:700 15px system-ui;color:#241d16}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;max-width:850px;margin:6vh auto;padding:20px}.r{height:230px;background:#fff7e7;border:4px solid #241d16;border-radius:16px;display:grid;place-items:center;text-align:center}.bot{width:70px;height:62px;background:#f1a91d;border:5px solid #241d16;border-radius:18px;position:relative;animation:bob 1.8s ease-in-out infinite}.eye{position:absolute;width:13px;height:13px;background:#fff;border:4px solid #241d16;border-radius:50%;right:10px;top:17px;animation:look 1.8s ease-in-out infinite}.hopper .bot{height:92px;width:42px;animation:hop 1.35s ease-in-out infinite}.roller .bot{width:95px;height:45px}.bucket .bot{transform:rotate(-3deg);animation:sleep 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(2px)}}@keyframes look{50%{transform:translateX(-7px)}}@keyframes hop{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-24px)}}@keyframes sleep{50%{transform:rotate(-5deg) translateY(2px)}}</style><div class=grid><div class="r hopper"><div><div class=bot><i class=eye></i></div><p>HOPPER<br>impatient metronome</p></div></div><div class="r roller"><div><div class=bot><i class=eye></i></div><p>ROLLER<br>diligent, oblivious</p></div></div><div class="r bucket"><div><div class=bot><i class=eye></i></div><p>BUCKET<br>sleepy</p></div></div><div class="r skitter"><div><div class=bot><i class=eye></i></div><p>SKITTER<br>curious</p></div></div></div>
