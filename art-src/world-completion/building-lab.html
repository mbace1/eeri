<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Eeri World Building Lab</title><style>body{margin:0;background:#51697b;font:800 16px system-ui;color:#fff}.wrap{max-width:760px;margin:5vh auto;padding:20px;text-align:center}.site{height:360px;background:#8bb1c7;border-bottom:60px solid #6e563b;position:relative;overflow:hidden}.b{position:absolute;left:50%;bottom:20px;width:360px;height:280px;transform:translateX(-50%)}.p{position:absolute;background:#d6b37b;border:4px solid #3a2c21;opacity:.08;transition:.25s}.p.on{opacity:1}.p0{left:40px;bottom:0;width:280px;height:35px}.p1{left:65px;bottom:39px;width:32px;height:95px}.p2{right:65px;bottom:39px;width:32px;height:95px}.p3{left:92px;bottom:115px;width:176px;height:30px}.p4{left:115px;bottom:145px;width:28px;height:95px}.p5{right:115px;bottom:145px;width:28px;height:95px}.p6{left:120px;bottom:225px;width:120px;height:26px}.p7{left:165px;bottom:145px;width:30px;height:70px}.p8{left:145px;bottom:255px;width:70px;height:16px}.lamp{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#ffd66b;box-shadow:0 0 28px #ffd66b;display:none}.full .lamp{display:block}input{width:min(500px,90%)}.count{font-size:32px}</style><div class=wrap><h1>WORLD BUILDING</h1><div class=site><div class=b id=b><i class=lamp></i><i class="p p0"></i><i class="p p1"></i><i class="p p2"></i><i class="p p3"></i><i class="p p4"></i><i class="p p5"></i><i class="p p6"></i><i class="p p7"></i><i class="p p8"></i></div></div><p class=count><span id=n>4</span> / 9</p><input id=r type=range min=0 max=9 value=4></div><script>const r=document.querySelector('#r'),b=document.querySelector('#b'),n=document.querySelector('#n');function paint(){n.textContent=r.value;b.querySelectorAll('.p').forEach((x,i)=>x.classList.toggle('on',i<+r.value));b.classList.toggle('full',+r.value===9)}r.oninput=paint;paint()</script>
