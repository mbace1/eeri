<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eeri Phone Lab</title><style>body{margin:0;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:#24323c;color:#fff;font:700 15px system-ui}.card{max-width:640px;margin:auto}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff30;padding:13px 0}.good{color:#92e29d}.warn{color:#ffd26b}button{min-height:48px;border:0;border-radius:10px;background:#ffb01f;font-weight:900;padding:8px 16px;margin-top:18px}</style><div class=card><h1>PHONE DIAGNOSTICS</h1><div id=o></div><button id=b>TEST AUDIO GESTURE</button></div><script>const o=document.querySelector('#o');function paint(){o.innerHTML='';const row=(k,v,good=true)=>o.insertAdjacentHTML('beforeend',`<div class=row><span>${k}</span><b class=${good?'good':'warn'}>${v}</b></div>`);row('viewport',`${innerWidth}×${innerHeight}`);row('DPR',devicePixelRatio,devicePixelRatio<=2);row('coarse pointer',matchMedia('(pointer:coarse)').matches?'yes':'no');row('reduced motion',matchMedia('(prefers-reduced-motion:reduce)').matches?'yes':'no');row('visibility',document.visibilityState);row('touch points',navigator.maxTouchPoints||0)}paint();addEventListener('resize',paint);document.addEventListener('visibilitychange',paint);document.querySelector('#b').onclick=async()=>{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A();await a.resume();const row=document.createElement('div');row.className='row';row.innerHTML=`<span>audio context</span><b class=${a.state==='running'?'good':'warn'}>${a.state}</b>`;o.append(row);a.close()}</script>
