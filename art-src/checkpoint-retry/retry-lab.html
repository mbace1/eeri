<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Eeri Retry Lab</title><style>body{font-family:system-ui;background:#6fc2f2;margin:0}.stage{max-width:700px;height:360px;margin:8vh auto;background:#d9c58f;border-bottom:70px solid #80623e;position:relative;overflow:hidden}.kid{position:absolute;left:55%;bottom:70px;width:38px;height:72px;background:#ffb01f;border:4px solid #241d16;border-radius:18px}.cp{position:absolute;left:28%;bottom:70px;width:12px;height:100px;background:#6c7476}.cp:after{content:'✓';position:absolute;top:-20px;left:-14px;width:38px;height:38px;border-radius:50%;background:#55b46e;display:grid;place-items:center;font-weight:900}.veil{position:absolute;inset:0;background:#f2e5c8;opacity:0;pointer-events:none}button{position:absolute;left:20px;top:20px;min-height:44px;font-weight:800}.stage.retry .veil{animation:retry .35s ease}.stage.retry .kid{animation:respawn .35s steps(1)}@keyframes retry{0%{opacity:0}35%{opacity:1}65%{opacity:1}100%{opacity:0}}@keyframes respawn{0%,40%{left:55%}41%,100%{left:30%}}</style><div class=stage id=s><button>SIMULATE PIT</button><div class=cp></div><div class=kid></div><div class=veil></div></div><script>const s=document.querySelector('#s');document.querySelector('button').onclick=()=>{s.classList.remove('retry');void s.offsetWidth;s.classList.add('retry')}</script>
