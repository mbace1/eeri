[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
; NOTE: "all_resources" packs everything under res://, referenced or not.
; Piritori shipped a 5.9MB orphaned Meshy test texture in every build this
; way. Here it is deliberate FOR NOW — no scene references any model yet, so
; a dependency-only filter would pack nothing and the size measurement would
; be a lie. Revisit once real scenes exist, and check data/ for strays first.
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, tests/*, data/.sync-stamp.json"
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; THREADS OFF, AND THIS IS NOT A PREFERENCE. Godot's threaded web build wants
; SharedArrayBuffer, which needs the COOP and COEP response headers. GitHub
; Pages serves static files and cannot set headers, so a threaded build is a
; black screen with a console error. The hub is on GitHub Pages.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
