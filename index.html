<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>EERI</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4aa8e8; }
  #game, #game canvas { position: fixed; inset: 0; display: block; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #4aa8e8; color: #fff; z-index: 10;
    font: 700 22px/1.4 system-ui, sans-serif; letter-spacing: 0.18em;
  }

  /* top-RIGHT: hub/shell.js owns the top-left corner with the HOME button */
  #hud {
    position: fixed; top: max(10px, env(safe-area-inset-top)); right: 14px; z-index: 5;
    text-align: right;
    color: #fff; font: 800 18px/1.3 system-ui, sans-serif; letter-spacing: 0.14em;
    text-shadow: 0 2px 0 rgba(26,20,16,0.45); user-select: none; pointer-events: none;
  }
  #bolts { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: #ffe9bd; }
  #site { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: #d9efff; }

  #hint {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); z-index: 5; pointer-events: none; user-select: none;
    color: #fff; font: 700 13px/1 system-ui, sans-serif; letter-spacing: 0.14em;
    background: rgba(26,20,16,0.5); padding: 9px 14px; border-radius: 8px;
    white-space: nowrap;
  }

  #clear, #banner {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
    z-index: 8; pointer-events: none; text-align: center;
    color: #fff; font: 800 34px/1 system-ui, sans-serif; letter-spacing: 0.2em;
    text-shadow: 0 3px 0 rgba(26,20,16,0.5);
    animation: pop 0.4s ease-out;
  }
  #clear span { display: block; font-size: 16px; letter-spacing: 0.12em; color: #ffe9bd; }
  @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #clear, #banner { animation: none; } }

  /* touch controls: fixed buttons, 44px floor, pointerdown/up never click */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #hint { bottom: max(84px, calc(env(safe-area-inset-bottom) + 72px)); }
  }
  #touch button {
    position: fixed; z-index: 6; width: 62px; height: 62px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.75); background: rgba(26,20,16,0.4);
    color: #fff; font: 800 16px system-ui, sans-serif; letter-spacing: 0.05em;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #tL { left: 16px;  bottom: max(16px, env(safe-area-inset-bottom)); }
  #tR { left: 92px;  bottom: max(16px, env(safe-area-inset-bottom)); }
  #tD { right: 168px; bottom: max(16px, env(safe-area-inset-bottom)); }
  #tA { right: 92px; bottom: max(16px, env(safe-area-inset-bottom)); }
  #tJ { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js?v=1" } }
</script>
</head>
<body>
<div id="game"></div>
<div id="hud">EERI<br><span id="site"></span><br><span id="bolts">⬡ 0</span></div>
<div id="hint"></div>
<div id="touch">
  <button id="tL" aria-label="left">◀</button>
  <button id="tR" aria-label="right">▶</button>
  <button id="tD" aria-label="boom down / dig">▼</button>
  <button id="tA" aria-label="ride">E</button>
  <button id="tJ" aria-label="jump">▲</button>
</div>
<div id="boot">EERI</div>
<script type="module" src="../hub/shell.js?v=17"></script>
<script type="module" src="./js/main.js?v=4"></script>
<script type="module">
  // bottom-right: the HOME button owns top-left and the HUD owns top-right.
  // Under a thumb that corner also holds the jump button (#tJ, 62px at
  // inset 16), and the badge at inset 12 sat on top of it — inert, per the
  // house rule, but covering the one control the game is played with. So on
  // a coarse pointer it climbs clear of the whole button row.
  import { sign } from '../toko/js/signature.js?v=3';
  const coarse = matchMedia('(pointer: coarse)').matches;
  sign({ corner: 'bottom-right', counter: true, inset: coarse ? 92 : 12 });
</script>
</body>
</html>
